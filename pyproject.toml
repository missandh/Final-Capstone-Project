[project]
name = "practo-domain-agent"
version = "0.1.0"
description = "Domain-specific clinical decision support agent with governance and RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["core", "rag", "agents", "governance", "evaluation", "api", "scripts"]
